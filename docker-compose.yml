services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:80"
    env_file:
      - .env
    environment:
      APP_URL: "${PUBLIC_APP_URL:-http://localhost:${APP_PORT:-8000}}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DOCKER_DB_DATABASE:-karismatif_db}"
      DB_USERNAME: "${DOCKER_DB_USERNAME:-karismatif}"
      DB_PASSWORD: "${DOCKER_DB_PASSWORD:-secret}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-public-storage:/var/www/html/storage/app/public

  db:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: "${DOCKER_DB_DATABASE:-karismatif_db}"
      MYSQL_USER: "${DOCKER_DB_USERNAME:-karismatif}"
      MYSQL_PASSWORD: "${DOCKER_DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DOCKER_DB_ROOT_PASSWORD:-root}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
  app-public-storage:
